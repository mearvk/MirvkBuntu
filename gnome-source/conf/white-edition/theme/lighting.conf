# Ubuntu White Edition — precision lighting specification
#
# One virtual light source is shared by desktop objects. Values describe the
# intended visual model; compositor/theme implementations translate them into
# supported effects rather than treating this file as a GNOME API.

[light]
# Upper-left key light, expressed as a screen-space direction.
direction_x=-0.70710678
direction_y=-0.70710678
intensity=0.82

[ambient]
intensity=0.18

[icons]
# Small, precise contact shadow; icons remain visually light.
elevation=2
shadow_offset_x=1
shadow_offset_y=2
shadow_blur=4
shadow_opacity=0.20

[taskbar]
elevation=4
shadow_offset_x=0
shadow_offset_y=-2
shadow_blur=14
shadow_opacity=0.14

[window]
elevation=8
shadow_offset_x=0
shadow_offset_y=5
shadow_blur=24
shadow_opacity=0.20

[window-focused]
elevation=10
shadow_offset_x=0
shadow_offset_y=6
shadow_blur=28
shadow_opacity=0.24
accent=#e95420

[dialog]
elevation=14
shadow_offset_x=0
shadow_offset_y=8
shadow_blur=32
shadow_opacity=0.26

[motion]
# Keep the virtual light stationary while objects move. Elevation changes,
# rather than a moving bitmap shadow, communicate lift during drag operations.
drag_elevation=14
focus_transition_ms=140
movement_transition_ms=120

[policy]
# Avoid pure black shadows and excessive glow.
maximum_shadow_opacity=0.30
black_shadow=false
glow=false
