# Ubuntu White Edition — desktop icon source contract
#
# INITIAL DESKTOP LAF SOURCE:
#   ubuntu-white/icons/set-002/
#
# Set-002 is the current development artwork set. It contains PNG artwork
# intended for the Desktop LAF. Do not substitute SVG or another icon set for
# this initial configuration without an explicit LAF revision.

[source]
root=ubuntu-white/icons/set-002
format=png

[theme]
name=Ubuntu-White
scope=desktop
role=initial-desktop-laf

[policy]
# Treat the icon tree as trusted build input only after structural validation.
# Do not follow symlinks outside the repository icon root during installation.
allow_external_symlinks=false
preserve_transparency=true
preserve_source_artwork=true

[development]
# Set-002 is the development source of truth. Keep source PNGs unchanged;
# sizing, placement, and packaging belong to the build/theme layer.
source_artwork_is_immutable=true
accepted_extension=.png

[installation]
# The build system supplies the target icon-theme directory. Artwork is copied
# into the theme package after validation rather than being written into GNOME
# source trees.
