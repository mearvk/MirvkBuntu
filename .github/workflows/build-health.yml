name: MirvkBuntu Build Health

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  health:
    name: make health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MirvkBuntu
        uses: actions/checkout@v4
      - name: Run build health
        run: make health
